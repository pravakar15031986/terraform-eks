apiVersion: apps/v1
kind: Deployment
metadata:
  name: saleor-payment-qa
  labels:
    app: saleor-payment-qa
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 0
  replicas: 2
  selector:
    matchLabels:
      app: saleor-payment-qa
  template:
    metadata:
      labels:
        app: saleor-payment-qa
    spec:
      containers:
        - name: saleor-payment
          image: 476114148868.dkr.ecr.eu-west-2.amazonaws.com/saleor-payment-qa
          envFrom:
            - configMapRef:
                name: saleor-payment-env-cm
            - secretRef:
                name: saleor-payment-env-sec
          ports:
            - containerPort: 3000
              name: http-saleor                   
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "1024Mi"
