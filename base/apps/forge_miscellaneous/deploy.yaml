apiVersion: apps/v1
kind: Deployment
metadata:
  name: forge-miscellaneous-develop
  labels:
    app: forge-miscellaneous-develop
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  replicas: 1
  selector:
    matchLabels:
      app: forge-miscellaneous-develop
  template:
    metadata:
      labels:
        app: forge-miscellaneous-develop
    spec:
      containers:
        - name: forge-miscellaneous
          image: 476114148868.dkr.ecr.eu-west-2.amazonaws.com/forge-miscellaneous-develop
          envFrom:
            - configMapRef:
                name: forge-miscellaneous-env-cm
            - secretRef:
                name: forge-miscellaneous-env-sec
          ports:
            - containerPort: 9000
              name: http-forge                  
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "1024Mi"
          readinessProbe:
            exec:
              command:
              - sh
              - -c
              - "curl localhost:9000/"
            initialDelaySeconds: 300
            periodSeconds: 15
            successThreshold: 1