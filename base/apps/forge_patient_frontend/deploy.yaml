apiVersion: apps/v1
kind: Deployment
metadata:
  name: forge-patient-frontend-develop
  labels:
    app: forge-patient-frontend-develop
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  replicas: 1
  selector:
    matchLabels:
      app: forge-patient-frontend-develop
  template:
    metadata:
      labels:
        app: forge-patient-frontend-develop
    spec:
      containers:
        - name: forge-patient-frontend
          image: 476114148868.dkr.ecr.eu-west-2.amazonaws.com/forge-patient-frontend-develop
          envFrom:
            - configMapRef:
                name: forge-patient-frontend-env-cm
            - secretRef:
                name: forge-patient-frontend-env-sec
          ports:
            - containerPort: 3000
              name: http-admin               
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "1024Mi"
