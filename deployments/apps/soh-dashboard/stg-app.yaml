apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: saleor-dashboard-staging
  namespace: argocd
spec:
  project: sop-staging
  source:
    repoURL: 'https://github.com/Simple-Online-Healthcare/forge_k8s_manifests.git'
    path: deployments/apps/soh-dashboard
    targetRevision: deploy-staging
    directory:
      recurse: false
      jsonnet: {}
  destination:
    namespace: saleor-dashboard-staging
    name: forge-staging
  syncPolicy:
    automated:
      prune: true
      allowEmpty: true    
    syncOptions:
      - CreateNamespace=true
