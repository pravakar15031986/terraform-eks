apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: 
  name: hpasaleorfrontend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: forge-miscellaneous-develop
  minReplicas: 2
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60