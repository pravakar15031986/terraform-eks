apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: forge-miscellaneous-develop
  namespace: argocd
spec:
  project: sop-develop
  source:
    repoURL: 'https://github.com/Simple-Online-Healthcare/forge_k8s_manifests.git'
    path: deployments/apps/forge_miscellaneous
    targetRevision: deploy-develop
    directory:
      recurse: false
      jsonnet: {}
  destination:
    namespace: forge-miscellaneous-develop
    name: eks-forge-develop-cluster
  syncPolicy:
    automated:
      prune: true
      allowEmpty: true    
    syncOptions:
      - CreateNamespace=true
