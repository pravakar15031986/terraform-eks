apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: saleor-aws-secrets
spec:
  provider: aws
  secretObjects:
    - secretName: saleor-creds-sec
      type: Opaque
      data:
        - objectName: "saleor-sec-alias"
          key: saleor-creds

  parameters:
    objects: |
        - objectName: "/app/saleor-frontend/dev"
          objectType: "secretsmanager"  
          objectAlias: "saleor-sec-alias"
          objectVersionLabel: "AWSCURRENT"