apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: 
  name: hpasaleorbackend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: saleor-backend-staging
  minReplicas: 2
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
