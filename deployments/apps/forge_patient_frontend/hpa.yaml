apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: 
  name: hpapatientfrontendapi
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: forge-patient-frontend-develop
  minReplicas: 1
  maxReplicas: 1
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
