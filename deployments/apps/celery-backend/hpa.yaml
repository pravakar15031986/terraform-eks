apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: 
  name: hpasaleorcelery
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: saleor-celery-staging
  minReplicas: 1
  maxReplicas: 1
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
